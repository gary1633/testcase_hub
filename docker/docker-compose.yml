services:
  postgres:
    image: postgres:16-alpine
    container_name: tcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcms
      POSTGRES_PASSWORD: tcms_password
      POSTGRES_DB: tcms_db
    ports:
      - "5432:5432"
    volumes:
      - tcms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcms -d tcms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tcms-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@company.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tcms_pgdata:
